name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Content
        run: pnpm content:validate
      - name: Copy (banned wording)
        run: pnpm copy:lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm exec next build
      - name: JS budget (own code ≤ 30 KB per page)
        run: pnpm bundle:report
      - name: Links (internal 200, anchors, official accounts only)
        run: |
          pnpm exec next start -p 3000 &
          npx --yes wait-on http://localhost:3000 --timeout 60000
          pnpm links:check http://localhost:3000

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (functional, a11y, responsive, SEO; visual baselines are local-only)
        run: pnpm exec playwright test --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (indexable, so the SEO category is meaningful)
        run: pnpm exec next build
        env:
          INDEXABLE: "1"
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
      - name: Lighthouse CI (§16 budgets)
        run: |
          set -o pipefail
          npx --yes @lhci/cli@0.15.1 autorun 2>&1 | tee lhci.log || {
            # Surface the cause as a check annotation (visible without log access).
            tail -n 40 lhci.log | sed 's/\x1b\[[0-9;]*m//g' | tr '\n' '|' | sed 's/^/::error title=Lighthouse CI::/'; echo
            exit 1
          }
        env:
          INDEXABLE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14
